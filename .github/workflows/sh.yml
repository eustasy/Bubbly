# eustasy/.Normal 4.0beta8
name: Normal (Shell)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**.sh"]
  pull_request:
    branches: [main]
    paths: ["**.sh"]

permissions:
  contents: read

jobs:
  sh:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: Lint (shellcheck)
        run: qlty check --all --no-formatters --filter=shellcheck

      - name: Format check (shfmt)
        run: qlty check --all --filter=shfmt
