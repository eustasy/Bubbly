# eustasy/.Normal 5.1
name: "Normal: Security"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so CVEs published against unchanged dependencies are still caught
  # in repositories that rarely see a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: eustasy/.normal/security@v5
