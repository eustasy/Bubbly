name: Nginx Config

on:
  workflow_dispatch:
  push:
    paths:
      - 'nginx-config/**'
      - 'bubbly_*.sh'
      - '.github/workflows/nginx.yml'
  pull_request:
    paths:
      - 'nginx-config/**'
      - 'bubbly_*.sh'
      - '.github/workflows/nginx.yml'

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

# Container jobs default to `sh -e`, not bash — the runner does not probe the
# image for it. Declaring bash keeps every run block on one interpreter, and on
# the same one the helper scripts use.
defaults:
  run:
    shell: bash

jobs:
  nginx-t:
    name: nginx -t (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Bubbly 3.x runs on the distribution's own Nginx, with no third-party
        # repositories — see the Requirements section of the README. Using
        # distro packages here also tests the layout Bubbly assumes: Debian and
        # Ubuntu include sites-enabled/ from nginx.conf, which the packages
        # from nginx.org do not.
        include:
          # The reference target: Nginx 1.28, OpenSSL 3.5.
          - name: Ubuntu 26.04 LTS
            image: ubuntu:26.04
          # The lowest supported Nginx: 1.26, OpenSSL 3.5.
          - name: Debian 13
            image: debian:13
    steps:
      # Installed before checkout so actions/checkout uses git rather than
      # falling back to downloading a tarball.
      - name: Install Nginx and tooling
        run: |
          apt-get update
          apt-get install -y nginx openssl curl rsync sudo git ca-certificates
          nginx -V

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy the config with bubbly_copy-configs.sh
        run: ./bubbly_copy-configs.sh

      - name: Confirm nginx.conf includes sites-enabled
        # Bubbly's whole sites-available/sites-enabled layout depends on this.
        # Without the include, everything below would pass while the site
        # templates were never read at all.
        run: |
          grep -q 'sites-enabled' /etc/nginx/nginx.conf || {
            echo "::error::This Nginx does not include sites-enabled/, so Bubbly's site templates would never be read"
            exit 1
          }

      - name: Generate self-signed certificates
        # bubbly_https.conf expects /etc/letsencrypt/live/<domain>/*.pem. A
        # self-signed certificate satisfies the file-existence and PEM-validity
        # checks nginx -t performs. It has no issuer to fetch OCSP from, so
        # nginx -t warns that ssl_stapling is ignored; that warning is expected.
        run: |
          for domain in example.com alpha.test beta.test; do
            mkdir -p "/etc/letsencrypt/live/$domain"
            openssl req -x509 \
              -newkey ec \
              -pkeyopt ec_paramgen_curve:P-384 \
              -keyout "/etc/letsencrypt/live/$domain/privkey.pem" \
              -out "/etc/letsencrypt/live/$domain/fullchain.pem" \
              -days 1 -nodes \
              -subj "/CN=$domain"
          done

      - name: Enable the templates as shipped
        run: |
          rm -f /etc/nginx/sites-enabled/default
          for t in bubbly_default bubbly_http bubbly_https; do
            ln -sf "/etc/nginx/sites-available/$t.conf" \
              "/etc/nginx/sites-enabled/$t.conf"
          done

      - name: nginx -t (one site, no session ticket key present)
        # Proves the shipped config loads with no /etc/nginx/ssl/ticket.key,
        # which it must, now that the key is opt-in. The generator script runs
        # only afterwards, so this ordering is deliberate.
        run: |
          test ! -e /etc/nginx/ssl/ticket.key
          nginx -t

      - name: Generate the session ticket key with bubbly_generate-tickets.sh
        # Exercises the script itself, and its execute bit.
        run: |
          ./bubbly_generate-tickets.sh
          test -s /etc/nginx/ssl/ticket.key
          nginx -t

      # Two more sites, set up exactly the way the README tells operators to:
      # copy the template, replace example.com, symlink it into sites-enabled.
      # This is what exercises the problems that only appear once a server
      # hosts more than one site.
      - name: Add two more sites
        run: |
          for domain in alpha.test beta.test; do
            for kind in http https; do
              sed "s/example\.com/$domain/g" \
                "/etc/nginx/sites-available/bubbly_$kind.conf" \
                > "/etc/nginx/sites-available/${domain}_$kind.conf"
              ln -sf "/etc/nginx/sites-available/${domain}_$kind.conf" \
                "/etc/nginx/sites-enabled/${domain}_$kind.conf"
            done
          done

      - name: nginx -t (three sites)
        run: nginx -t

      - name: Confirm every site reached the effective config
        run: |
          nginx -T > /tmp/effective.conf
          for name in example.com alpha.test beta.test; do
            grep -q "server_name $name;" /tmp/effective.conf || {
              echo "::error::$name is missing from the effective config"
              exit 1
            }
          done

      # ── Runtime TLS probe ──────────────────────────────────────────────────
      # nginx -t only proves the config parses. The steps below start Nginx and
      # measure what each vhost actually negotiates, to establish whether
      # per-server TLS settings take effect at all. The documentation states
      # that ssl_protocols is taken from the default server for the listening
      # socket; ssl_ciphers and ssl_ecdh_curve are undocumented in that
      # respect, so they are measured here rather than assumed.
      - name: Give beta.test a deliberately different TLS profile
        run: |
          cat > /etc/nginx/directive/ci_beta-ssl.conf <<'EOF'
          # CI fixture, not part of Bubbly. Every value differs from
          # bubbly_rock-hard-ssl.conf so the probe can tell which server
          # block's settings were actually applied.
          ssl_protocols TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES256-SHA384;
          ssl_ecdh_curve prime256v1;
          ssl_prefer_server_ciphers on;
          EOF
          sed -i 's|include directive/bubbly_rock-hard-ssl.conf;|include directive/ci_beta-ssl.conf;|' \
            /etc/nginx/sites-available/beta.test_https.conf
          grep -n 'ci_beta-ssl.conf' /etc/nginx/sites-available/beta.test_https.conf

      - name: nginx -t (mixed TLS profiles)
        run: nginx -t

      - name: Start Nginx
        # Readiness is checked with a valid SNI name, because the default server
        # now refuses handshakes that match no site.
        run: |
          nginx
          for _ in $(seq 1 20); do
            if openssl s_client -connect 127.0.0.1:443 -servername alpha.test -brief \
                </dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          openssl s_client -connect 127.0.0.1:443 -servername alpha.test -brief \
            </dev/null >/dev/null 2>&1 || {
            echo "::error::Nginx did not accept TLS connections after starting"
            cat /var/log/nginx/error.log || true
            exit 1
          }

      - name: The default server refuses anything unmatched
        # bubbly_default.conf claims default_server on both ports, so a
        # connection with no SNI, an unknown SNI name, or an unknown Host header
        # reaches it rather than whichever site sorted first.
        run: |
          status=0

          for probe in "-noservername" "-servername nope.invalid"; do
            # shellcheck disable=SC2086
            if openssl s_client -connect 127.0.0.1:443 $probe -brief \
                </dev/null >/tmp/rejected 2>&1; then
              echo "::error::TLS handshake with '$probe' succeeded; ssl_reject_handshake is not in force"
              cat /tmp/rejected
              status=1
            else
              echo "ok   handshake refused for '$probe'"
            fi
          done

          if curl -sS --max-time 10 -o /dev/null \
              -H 'Host: nope.invalid' http://127.0.0.1/ 2>/tmp/curlerr; then
            echo "::error::HTTP request for an unknown Host got a response; expected 444"
            status=1
          else
            echo "ok   HTTP closed without a response for an unknown Host: $(cat /tmp/curlerr)"
          fi

          exit $status

      - name: ACME passthrough still reaches a real site
        # The renewal flow in the README depends on this surviving whatever the
        # default server does with unmatched traffic.
        run: |
          mkdir -p /tmp/bubbly-authenticator/.well-known/acme-challenge
          echo 'bubbly-ci-token' \
            > /tmp/bubbly-authenticator/.well-known/acme-challenge/ci-probe
          body="$(curl -sS --max-time 10 -H 'Host: alpha.test' \
            http://127.0.0.1/.well-known/acme-challenge/ci-probe)"
          echo "served: $body"
          test "$body" = "bubbly-ci-token"

      - name: Caching headers apply per site, not server-wide
        # conf.d/expires-map.conf defines $expires but no longer applies it, so
        # only sites that include groups/performance-common.conf get caching
        # headers. bubbly_http.conf does not include it, and an ACME response is
        # text/plain, which the map's 1y fallback used to catch — so it must now
        # come back with no Expires header at all.
        run: |
          status=0

          acme="$(curl -sSI --max-time 10 -H 'Host: alpha.test' \
            http://127.0.0.1/.well-known/acme-challenge/ci-probe)"
          echo "$acme"
          if echo "$acme" | grep -qi '^expires:'; then
            echo "::error::the ACME response carries an Expires header, so expires is still being applied server-wide"
            status=1
          else
            echo "ok   no Expires header on the ACME response"
          fi

          # The HTTPS site does include performance-common, so text/html must
          # still come back as the map specifies: epoch, meaning no-cache.
          mkdir -p /path/to/alpha.test
          echo '<!doctype html><title>ci</title>' > /path/to/alpha.test/index.html
          html="$(curl -sSI -k --max-time 10 --resolve alpha.test:443:127.0.0.1 \
            https://alpha.test/index.html)"
          echo "$html"
          if echo "$html" | grep -qi '^cache-control: *no-cache'; then
            echo "ok   HTML over HTTPS is no-cache, as the map specifies"
          else
            echo "::error::the HTTPS site is missing the caching headers groups/performance-common.conf should apply"
            status=1
          fi

          exit $status

      - name: Rate limits are shared server-wide but isolated per site
        # The point of the site-scoped zones in conf.d/bubbly_limits.conf. Both
        # families are exercised with the 1r/s zones and no burst, so the second
        # request within a second is refused: hammer alpha.test, then ask
        # beta.test once and see whether it was charged for alpha's traffic.
        #
        # The ACME path is used rather than `/` because `/` is a `return 308`,
        # and `return` is handled in the rewrite phase — before the preaccess
        # phase where limit_req runs — so a redirect is finalised without ever
        # consulting the limit. Static content goes through preaccess normally.
        run: |
          status=0

          # Applied through security-common, which both sites include, so the
          # limit lands inside each server block without editing site files.
          echo 'include directive/ci_limit.conf;' >> /etc/nginx/groups/security-common.conf

          probe='http://127.0.0.1/.well-known/acme-challenge/ci-probe'

          hammer() {
            for _ in 1 2 3 4 5; do
              curl -sS -o /dev/null -w '%{http_code} ' --max-time 5 \
                -H "Host: $1" "$probe"
            done
          }

          check() { # $1 = zone, $2 = status beta.test should return
            printf 'limit_req zone=%s;\n' "$1" > /etc/nginx/directive/ci_limit.conf
            nginx -t
            nginx -s reload
            sleep 1
            alpha="$(hammer alpha.test)"
            beta="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              -H 'Host: beta.test' "$probe")"
            echo "zone=$1  alpha=[$alpha]  beta=$beta  (beta expected $2)"
            case "$alpha" in
              *503*) ;;
              *)
                echo "::error::zone $1 never returned 503, so the limit was not applied and the result below means nothing"
                return 1 ;;
            esac
            if [ "$beta" != "$2" ]; then
              echo "::error::with zone $1, beta.test returned $beta but $2 was expected"
              return 1
            fi
            return 0
          }

          # Keyed on the client address alone: beta.test is charged for the
          # traffic alpha.test just sent, and is refused.
          check reqPerSec1 503 || status=1

          # Keyed on the server name too: beta.test has its own budget, so it is
          # served the token.
          check siteReqPerSec1 200 || status=1

          exit $status

      - name: SNI selects the matching certificate
        run: |
          status=0
          for name in example.com alpha.test beta.test; do
            out="$(openssl s_client -connect 127.0.0.1:443 -servername "$name" -brief </dev/null 2>&1)"
            cn="$(echo "$out" | sed -n 's/^Peer certificate: .*CN *= *//p' | head -1)"
            proto="$(echo "$out" | sed -n 's/^Protocol version: *//p' | head -1)"
            suite="$(echo "$out" | sed -n 's/^Ciphersuite: *//p' | head -1)"
            group="$(echo "$out" | sed -n 's/^Negotiated TLS1.3 group: *//p' | head -1)"
            printf '%-12s cert=%-12s %s %s group=%s\n' \
              "$name" "${cn:-none}" "${proto:-?}" "${suite:-?}" "${group:-none}"
            if [ "$cn" != "$name" ]; then
              echo "::error::$name was served a certificate for ${cn:-nothing}"
              echo "$out"
              status=1
            fi
          done
          exit $status

      - name: Assert how per-vhost TLS settings behave
        # Measured 2026-08-05 and now asserted, because the socket-wide split in
        # conf.d/bubbly_ssl.conf depends on it: if Nginx's behaviour changes,
        # this should fail loudly rather than quietly invalidate the design.
        # beta.test asks for TLS 1.3 only, one CBC cipher and prime256v1, while
        # the socket-wide values are TLS 1.2 + 1.3, GCM/ChaCha and
        # X25519MLKEM768.
        run: |
          status=0

          # Each handshake is written to a file and grepped separately, never
          # piped into grep. This job runs with bash's `-o pipefail`, under which
          # `grep -q` exiting on its first match can kill openssl with SIGPIPE
          # and fail the whole pipeline even though the handshake succeeded —
          # which is exactly how this check once reported the opposite result on
          # one platform and not the other. `|| true` is needed because openssl
          # also exits non-zero when a handshake is legitimately refused.
          echo "--- baseline: alpha.test, no per-server overrides, over TLS 1.2 ---"
          openssl s_client -connect 127.0.0.1:443 -servername alpha.test -tls1_2 -brief \
            </dev/null > /tmp/alpha12 2>&1 || true
          grep -q '^Protocol version' /tmp/alpha12 || {
            echo "::error::TLS 1.2 is unavailable server-wide, so the checks below cannot be interpreted"
            cat /tmp/alpha12
            exit 1
          }
          echo "ok   TLS 1.2 available, cipher $(sed -n 's/^Ciphersuite: *//p' /tmp/alpha12 | head -1)"

          echo "--- beta.test over TLS 1.2, despite asking for TLS 1.3 only ---"
          openssl s_client -connect 127.0.0.1:443 -servername beta.test -tls1_2 -brief \
            </dev/null > /tmp/beta12 2>&1 || true
          if grep -q '^Protocol version' /tmp/beta12; then
            echo "ok   accepted — per-vhost ssl_protocols is ignored, as expected"
          else
            echo "::error::beta.test refused TLS 1.2, so per-vhost ssl_protocols now applies. Nginx behaviour has changed — revisit the socket-wide split in conf.d/bubbly_ssl.conf"
            cat /tmp/beta12
            status=1
          fi

          suite="$(sed -n 's/^Ciphersuite: *//p' /tmp/beta12 | head -1)"
          if [ "$suite" = "ECDHE-ECDSA-AES256-SHA384" ]; then
            echo "ok   cipher $suite — per-vhost ssl_ciphers applies, as expected"
          else
            echo "::error::beta.test negotiated '$suite' rather than its own cipher, so the per-site override offered in directive/bubbly_rock-hard-ssl.conf no longer works"
            status=1
          fi

          echo "--- beta.test over TLS 1.3, negotiated group ---"
          openssl s_client -connect 127.0.0.1:443 -servername beta.test -tls1_3 -brief \
            </dev/null > /tmp/beta13 2>&1
          group="$(sed -n 's/^Negotiated TLS1.3 group: *//p' /tmp/beta13 | head -1)"
          if [ "$group" = "X25519MLKEM768" ]; then
            echo "ok   group $group — per-vhost ssl_ecdh_curve is ignored, as expected"
          else
            echo "::error::beta.test negotiated group '${group:-unreadable}', expected the socket-wide X25519MLKEM768"
            cat /tmp/beta13
            status=1
          fi

          exit $status

  scripts:
    name: Helper scripts are executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Every bubbly_*.sh is executable
        # The README tells operators to run these directly, so a missing
        # execute bit breaks the documented flow with "Permission denied".
        # bubbly_renew-ssl.sh is never run by the other jobs — it would have to
        # talk to Let's Encrypt — so without this its mode goes unchecked.
        run: |
          status=0
          for f in bubbly_*.sh; do
            if [ -x "$f" ]; then
              echo "ok   $f"
            else
              echo "::error file=$f::$f is not executable; its git mode should be 100755"
              status=1
            fi
          done
          exit $status

  php-socket-path:
    name: PHP socket path matches the platform
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install PHP-FPM
        # php-cli is installed alongside php-fpm only so that `php -v` — the
        # check the README suggests — is available to report the version.
        run: |
          apt-get update
          apt-get install -y php-fpm php-cli git ca-certificates
          php -v

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare the active socket with the php-fpm pool
        # The [DEFAULT] option in php_sockets.conf has to name the socket the
        # reference platform's PHP-FPM actually listens on. Compared by
        # basename, because Bubbly writes /var/run/php/… while the pool config
        # writes /run/php/… — the same file, as /var/run is a symlink to /run.
        run: |
          bubbly_sock="$(sed -n 's/^[[:space:]]*server[[:space:]]\+unix:\([^;]*\);.*/\1/p' \
            nginx-config/conf.d/php_sockets.conf | head -1)"
          pool_sock="$(sed -n 's/^listen[[:space:]]*=[[:space:]]*//p' \
            /etc/php/*/fpm/pool.d/www.conf | head -1)"
          echo "php_sockets.conf: ${bubbly_sock:-<none found>}"
          echo "php-fpm pool:     ${pool_sock:-<none found>}"
          test -n "$bubbly_sock"
          test -n "$pool_sock"
          if [ "$(basename "$bubbly_sock")" != "$(basename "$pool_sock")" ]; then
            echo "::error::php_sockets.conf selects $(basename "$bubbly_sock") but this platform's PHP-FPM listens on $(basename "$pool_sock")"
            exit 1
          fi
