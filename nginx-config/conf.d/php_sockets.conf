####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	PHP Sockets
# One upstream per supported branch, newest first. Dates from
# https://www.php.net/supported-versions.php, which retires branches at year end.
#
# [WARNING] Two `server` lines in one upstream is round-robin between them, not
# per-site routing. Select an upstream per site instead — see the [OPTION] in
# location/bubbly_extensionless-php.conf.
# [WARNING] Nothing here checks a socket exists. A missing pool is a 502 at
# request time, not an `nginx -t` failure; `ls /var/run/php/` shows what is real.
# [OPTION] `keepalive` reuses connections, and needs the `fastcgi_keep_conn on;`
#          already set in location/bubbly_extensionless-php.conf.
# [WARNING] Each idle connection holds an FPM child, so worker_processes ×
#           keepalive must fit inside that pool's pm.max_children.


# 8.5 — active to 2027-12-31, security to 2029-12-31
upstream php85 {
	server unix:/var/run/php/php8.5-fpm.sock;
	#keepalive 8;
}

# 8.4 — active to 2026-12-31, security to 2028-12-31
upstream php84 {
	server unix:/var/run/php/php8.4-fpm.sock;
	#keepalive 8;
}

# 8.3 — security only, to 2027-12-31
upstream php83 {
	server unix:/var/run/php/php8.3-fpm.sock;
	#keepalive 8;
}

# 8.2 — security only, to 2026-12-31
upstream php82 {
	server unix:/var/run/php/php8.2-fpm.sock;
	#keepalive 8;
}


####	Default target, for sites that do not select one
# [OPTION] Point at the newest branch installed.
# [DEFAULT] 8.5.
# [WARNING] Keep the name: location/bubbly_extensionless-php.conf passes to it.
upstream php_sockets {
	server unix:/var/run/php/php8.5-fpm.sock;
	#keepalive 8;
}
