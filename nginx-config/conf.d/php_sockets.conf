####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	PHP Sockets
# One upstream per PHP branch still receiving support, newest first. Dates are
# from https://www.php.net/supported-versions.php — PHP retires a branch at the
# end of a calendar year, so every date here is a 31 December.
#
# [WARNING] Several `server` lines inside a single upstream is round-robin load
# balancing between them, not per-site routing: one site's requests would
# alternate between PHP versions at random. Give different sites different
# versions by selecting a different upstream per site — see the [OPTION] in
# location/bubbly_extensionless-php.conf.
# [WARNING] Nothing here checks that a socket exists. A site pointed at a branch
# whose FPM pool is not installed and running returns 502 at request time,
# without a word from `nginx -t`. `ls /var/run/php/` shows what is really there.
# [WARNING] Ubuntu and Debian each ship exactly one PHP branch. Running several
# side by side needs Ondřej Surý's packages — see Requirements in the README.
# [OPTION] Uncomment `keepalive` in an upstream to reuse connections to that
#          pool. It also needs `fastcgi_keep_conn on;`, already set in
#          location/bubbly_extensionless-php.conf, where it does nothing without
#          this.
# [WARNING] Each idle kept-alive connection occupies an FPM child for as long as
#           it is held, so worker_processes × keepalive has to fit inside that
#           pool's pm.max_children, or real requests queue behind connections
#           doing nothing.


# PHP 8.5 — active support to 2027-12-31, security fixes to 2029-12-31
upstream php85 {
	server unix:/var/run/php/php8.5-fpm.sock;
	#keepalive 8;
}

# PHP 8.4 — active support to 2026-12-31, security fixes to 2028-12-31
upstream php84 {
	server unix:/var/run/php/php8.4-fpm.sock;
	#keepalive 8;
}

# PHP 8.3 — security fixes only, to 2027-12-31
upstream php83 {
	server unix:/var/run/php/php8.3-fpm.sock;
	#keepalive 8;
}

# PHP 8.2 — security fixes only, to 2026-12-31
upstream php82 {
	server unix:/var/run/php/php8.2-fpm.sock;
	#keepalive 8;
}


####	Default Target
# The upstream a site uses unless it selects another for itself.
# [OPTION] Point this at the newest branch you actually have installed.
# [DEFAULT] PHP 8.5, matching the newest supported branch above.
# [WARNING] Keep this name. location/bubbly_extensionless-php.conf passes to it
#           by default, so renaming it breaks every site at once.
upstream php_sockets {
	server unix:/var/run/php/php8.5-fpm.sock;
	#keepalive 8;
}
