####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	TLS Session Resumption and OCSP Resolver
# [WARNING] Only what the distribution's nginx.conf does not already set belongs
# here. Debian and Ubuntu set ssl_protocols, ssl_prefer_server_ciphers and
# keepalive_timeout in theirs, and repeating any at this level is a fatal
# "directive is duplicate" — hence directive/bubbly_ssl-profile.conf per server.

# [WARNING] Required for TLS 1.3, recommended for TLS 1.2.
ssl_session_tickets on;
ssl_session_timeout 24h;

# One cache for every site, so the sizes cannot disagree — Nginx rejects that.
# [WARNING] Shared state means a session begun on one site can be resumed
# against another, so one site's TLS settings are not a boundary around it. A
# site needing one declares its own zone, under another name, in its server block.
ssl_session_cache shared:SSL:10m;

# [OPTION] Explicit ticket key, written by bubbly_generate-tickets.sh.
# [DEFAULT] Off — Nginx 1.23.2+ generates and rotates its own in the cache above.
# [WARNING] Only for several instances behind a load balancer resuming each
#           other's tickets. Newest first: the first encrypts, the rest decrypt.
#ssl_session_ticket_key /etc/nginx/ssl/ticket.key;
#ssl_session_ticket_key /etc/nginx/ssl/ticket.old.key;


####	OCSP Resolver
# For ssl_stapling, enabled per site in directive/bubbly_rock-hard-ssl.conf.
# Cloudflare, Quad9, Google, OpenDNS.
resolver 1.1.1.1 1.0.0.1 9.9.9.9 149.112.112.112 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=300s;
resolver_timeout 3s;
