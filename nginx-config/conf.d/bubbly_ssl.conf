####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	TLS Session Resumption and the OCSP Resolver
# Loaded automatically at the `http` level, so every site shares one session
# cache and one resolver cache.
#
# [WARNING] Only settings the distribution's own nginx.conf does not already
# set belong here. Debian and Ubuntu set ssl_protocols,
# ssl_prefer_server_ciphers and keepalive_timeout in their nginx.conf, and
# repeating any of those at this level stops Nginx starting with
# "directive is duplicate". The protocol and cipher profile therefore lives in
# directive/bubbly_ssl-profile.conf, included per server.


####	Session Resumption
# [WARNING] Session Tickets must be enabled for TLS 1.3, and are recommended for TLS 1.2.
ssl_session_tickets on;
ssl_session_timeout 24h;

# One shared cache for every site. Declared here rather than per site so the
# sizes cannot disagree, which Nginx rejects outright.
ssl_session_cache shared:SSL:10m;

# [OPTION] Set an explicit session ticket key.
# Option 1. [DEFAULT] Off. Nginx 1.23.2 and newer generate, store and
#           periodically rotate ticket keys in the shared cache above, which
#           beats one static key that never changes.
# Option 2. An explicit key, generated by bubbly_generate-tickets.sh.
# [WARNING] Only needed if several Nginx instances behind a load balancer must
#           resume each other's tickets. Rotate by listing two keys, newest
#           first: the first encrypts, the rest only decrypt.
#ssl_session_ticket_key /etc/nginx/ssl/ticket.key;
#ssl_session_ticket_key /etc/nginx/ssl/ticket.old.key;


####	OCSP Resolver
# Used by ssl_stapling, which is enabled per site in
# directive/bubbly_rock-hard-ssl.conf.
# Cloudflare DNS, Quad9 DNS, Google DNS, OpenDNS.
# (Dyn DNS 216.146.35.35/36 was retired by Oracle and has been removed.)
resolver 1.1.1.1 1.0.0.1 9.9.9.9 149.112.112.112 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=300s;
resolver_timeout 3s;
