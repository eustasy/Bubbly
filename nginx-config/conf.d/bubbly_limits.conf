####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	Rate Limit Zones
# Declarations only. Nothing limits until a site includes a
# directive/bubbly_limits_*.conf, and no group does — a safe rate depends on
# whether Nginx is behind a proxy and whether clients use HTTP/2, neither of
# which Bubbly can know. Treat the numbers as a starting point.
#
# [WARNING] Behind a proxy or CDN, $binary_remote_addr is the proxy and every
# zone below becomes one bucket for your whole audience. See
# directive/bubbly_real-ip.conf first. Clients sharing an address, such as NAT
# or a mobile carrier, likewise count as one.
# [WARNING] Neither limit applies to a `return` response, such as the redirect
# in bubbly_http.conf: `return` runs in the rewrite phase, before the preaccess
# phase where limits are evaluated. Only requests reaching content are limited.
# [WARNING] An HTTP/2 client multiplexes over one connection, so a connection
# cap catches floods rather than shaping traffic. limit_req does that.
#
# 15MB total. Sizes follow how long a state lives, not traffic volume: a
# limit_req state is ~128 bytes and lasts about burst/rate seconds; a limit_conn
# state is ~64 bytes and lasts as long as the connection, which
# keepalive_timeout holds open for 300s.
# [WARNING] `rate=` belongs to the zone — limit_req accepts only burst and
# delay/nodelay — so a second rate means copying a line and renaming the zone.


####	Rejection
# [OPTION] 429 states what happened; Nginx's default 503 reads as an outage.
limit_req_status 429;
limit_conn_status 429;

# [OPTION] warn, not Nginx's error: being limited is expected under load.
limit_req_log_level warn;
limit_conn_log_level warn;


####	Keyed on the client address — one bucket per client, whole machine
# [WARNING] Requests to one site spend every other site's budget too.
limit_req_zone  $binary_remote_addr zone=reqPerIP:2m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conPerIP:5m;


####	Keyed on server name and address — one bucket per client per site
# Prefer these with more than one site. Holds one state per site per client, so
# raise the sizes as sites are added.
# [WARNING] $server_name, not $host: $host comes from the request, so a
# catch-all server would let one client mint unlimited keys and fill the zone.
limit_req_zone  $server_name$binary_remote_addr zone=siteReqPerIP:2m rate=20r/s;
limit_conn_zone $server_name$binary_remote_addr zone=siteConPerIP:5m;


####	Keyed on server name alone — one state per site, so 1m is ample
limit_conn_zone $server_name zone=conPerServer:1m;
