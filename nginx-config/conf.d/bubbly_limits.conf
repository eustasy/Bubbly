####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	Rate Limit Zones
# Declarations only. Nothing here limits anything until a site includes one of
# the directive/bubbly_limits_*.conf files.
# [WARNING] Every zone reserves its shared memory whether it is used or not, so
# the sizes below are the budget for the whole machine. Delete the zones you
# will not use rather than carrying them.


####	Server-wide, keyed on the client address
# [WARNING] One bucket per client for the entire machine. A client's requests to
# one site spend the same budget as its requests to every other site, and
# conPerIP caps its connections across all of them at once. Fine on a
# single-site server; on a shared one, a busy site starves its neighbours.
limit_req_zone  $binary_remote_addr zone=reqPerSec1:1m  rate=1r/s;
limit_req_zone  $binary_remote_addr zone=reqPerSec10:1m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=reqPerSec20:1m rate=20r/s;

limit_conn_zone $binary_remote_addr zone=conPerIP:10m;
limit_conn_zone $server_name        zone=conPerServer:10m; # already per-site


####	Per-site, keyed on the server name and the client address
# Prefer these when the machine hosts more than one site: each site gets its own
# bucket per client, so traffic to one cannot exhaust another's allowance.
# [WARNING] Keyed on $server_name — the first name of the matching server block
# — and deliberately not on $host. $host comes from the request, so a default
# server that matches any name would let one client mint unlimited distinct keys
# and exhaust the zone's memory.
limit_req_zone  $server_name$binary_remote_addr zone=siteReqPerSec1:1m  rate=1r/s;
limit_req_zone  $server_name$binary_remote_addr zone=siteReqPerSec10:1m rate=10r/s;
limit_req_zone  $server_name$binary_remote_addr zone=siteReqPerSec20:1m rate=20r/s;

limit_conn_zone $server_name$binary_remote_addr zone=siteConPerIP:10m;
