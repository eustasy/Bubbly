####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	Rate Limit Zones
# Declarations only. Nothing here limits anything until a site includes one of
# the directive/bubbly_limits_*.conf files.
#
# One zone per kind, sized for what it actually holds. Totals 15MB as shipped.
# Zones are named for what they key on, never for their rate or size, so both
# are editable here without renaming anything. Copy a line and rename the zone
# if you want a second rate: `rate=` is a property of the zone, and limit_req
# accepts only `burst=` and `nodelay`/`delay=`, so there is no way to vary a
# rate at the point of use.
#
# [WARNING] Sizing depends on how long a state lives, not on how much traffic
# passes through:
#   * A limit_req state is roughly 128 bytes on 64-bit, and survives about
#     burst/rate seconds past a client's last request — five seconds at the
#     rates below. The zone therefore only needs the clients active in that
#     window, so 2m (about 16,000) is generous.
#   * A limit_conn state is roughly 64 bytes and lives as long as the connection
#     does. Bubbly sets keepalive_timeout to 300s, so connections linger far
#     longer than request states and these zones need to be bigger: 5m holds
#     about 80,000.
# [WARNING] A zone keyed on the server name as well as the address holds one
# state per site per client, so a busy machine with many sites should raise the
# site-scoped sizes accordingly.
# [WARNING] Clients sharing an address — an office behind NAT, a mobile carrier
# — count as one. Raise the rate rather than the zone size for those, and prefer
# limiting only the expensive requests: see directive/bubbly_limits_site.conf.
# [WARNING] Behind a proxy, CDN or load balancer, $binary_remote_addr is the
# proxy, so all of these zones collapse to a single bucket for your entire
# audience. Set up directive/bubbly_real-ip.conf before enabling any limit
# there, or the limit will throttle everyone at once.


####	Rejection
# [OPTION] Status returned once a limit is hit.
# Option 1. [DEFAULT] 429 Too Many Requests, which says what happened and is
#           distinguishable from a real outage in monitoring.
# Option 2. 503, Nginx's default, which looks like the server is down.
limit_req_status 429;
limit_conn_status 429;

# [OPTION] Log level for a rejection. Being rate limited is expected behaviour
#          under load, not a server fault, so it is logged as a warning rather
#          than Nginx's default of `error`.
limit_req_log_level warn;
limit_conn_log_level warn;


####	Server-wide, keyed on the client address
# [WARNING] One bucket per client for the entire machine. A client's requests to
# one site spend the same budget as its requests to every other site, and
# conPerIP caps its connections across all of them at once. Fine on a
# single-site server; on a shared one, a busy site starves its neighbours.
limit_req_zone  $binary_remote_addr zone=reqPerIP:2m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conPerIP:5m;


####	Per-site, keyed on the server name and the client address
# Prefer these when the machine hosts more than one site: each site gets its own
# bucket per client, so traffic to one cannot exhaust another's allowance.
# [WARNING] Keyed on $server_name — the first name of the matching server block
# — and deliberately not on $host. $host comes from the request, so a default
# server that matches any name would let one client mint unlimited distinct keys
# and exhaust the zone's memory.
limit_req_zone  $server_name$binary_remote_addr zone=siteReqPerIP:2m rate=20r/s;
limit_conn_zone $server_name$binary_remote_addr zone=siteConPerIP:5m;


####	Per-site connection total, keyed on the server name alone
# Already per-site, and holds one state per site rather than one per client, so
# 1m is thousands of times more than it will ever need.
limit_conn_zone $server_name zone=conPerServer:1m;
