# Enable extensionless PHP
location @extensionless-php {
	rewrite ^(.*)$ $1.php last;
}



####	PHP
location ~ \.php$ {
	try_files $uri =404;

	# [OPTION] Rate limit only what costs something to serve. Uncomment one, and
	#          leave it out of the `server` block: limiting there counts every
	#          stylesheet and image as well, so a single cold-cache page load
	#          spends most of the burst and shared addresses see rejections.
	#include directive/bubbly_limits_site.conf; # per site per client
	#include directive/bubbly_limits_ip.conf;   # per client, whole machine

	include /etc/nginx/fastcgi_params;
	fastcgi_split_path_info ^(.+\.php)(/.+)$;
	fastcgi_index index.php;
	fastcgi_keep_conn on;
	fastcgi_intercept_errors on;
	fastcgi_hide_header "X-Powered-By";
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_pass php_sockets;

	# [OPTION] Specify time to wait in seconds for PHP to respond
	# [DEFAULT] 10 10 60
	fastcgi_connect_timeout 10;
	fastcgi_send_timeout    10;
	fastcgi_read_timeout    60;

}
