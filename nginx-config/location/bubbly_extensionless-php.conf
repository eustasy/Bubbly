# Enable extensionless PHP
location @extensionless-php {
	rewrite ^(.*)$ $1.php last;
}



####	PHP
location ~ \.php$ {
	try_files $uri =404;

	# [OPTION] Rate limit here rather than in the `server` block, so only requests
	#          that cost something are counted. See conf.d/bubbly_limits.conf.
	#include directive/bubbly_limits_site.conf; # per site per client
	#include directive/bubbly_limits_ip.conf;   # per client, whole machine

	include /etc/nginx/fastcgi_params;
	fastcgi_split_path_info ^(.+\.php)(/.+)$;
	fastcgi_index index.php;
	# [WARNING] Inert unless the chosen upstream also sets `keepalive`.
	fastcgi_keep_conn on;
	fastcgi_intercept_errors on;
	fastcgi_hide_header "X-Powered-By";
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

	# [OPTION] Which PHP version serves this request.
	# Option 1. [DEFAULT] One upstream for every site, resolved at config load, so
	#           a wrong name fails `nginx -t`.
	fastcgi_pass php_sockets;
	# Option 2. Per site, from `set $bubbly_php` in the site file — how one server
	#           runs several PHP versions.
	# [WARNING] Resolved per request, so a missing or misspelt `set` is a 502 with
	#           a clean `nginx -t`. A `map` fallback is impossible: Nginx refuses a
	#           variable created by both `map` and `set`.
	#fastcgi_pass $bubbly_php;

	# [OPTION] Seconds to wait for PHP.
	# [DEFAULT] 10 10 60
	fastcgi_connect_timeout 10;
	fastcgi_send_timeout    10;
	fastcgi_read_timeout    60;

}
