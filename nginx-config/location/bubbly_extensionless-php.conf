# Enable extensionless PHP
location @extensionless-php {
	rewrite ^(.*)$ $1.php last;
}



####	PHP
location ~ \.php$ {
	try_files $uri =404;

	# [OPTION] Rate limit only what costs something to serve. Uncomment one, and
	#          leave it out of the `server` block: limiting there counts every
	#          stylesheet and image as well, so a single cold-cache page load
	#          spends most of the burst and shared addresses see rejections.
	#include directive/bubbly_limits_site.conf; # per site per client
	#include directive/bubbly_limits_ip.conf;   # per client, whole machine

	include /etc/nginx/fastcgi_params;
	fastcgi_split_path_info ^(.+\.php)(/.+)$;
	fastcgi_index index.php;
	# [WARNING] Does nothing on its own: connections are only reused if the
	# chosen upstream also has `keepalive` set. See conf.d/php_sockets.conf.
	fastcgi_keep_conn on;
	fastcgi_intercept_errors on;
	fastcgi_hide_header "X-Powered-By";
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

	# [OPTION] Which PHP version serves this request.
	# Option 1. [DEFAULT] The php_sockets upstream, shared by every site on the
	#           server. The name is resolved when the config loads, so getting it
	#           wrong fails `nginx -t` rather than the next request.
	fastcgi_pass php_sockets;

	# Option 2. Per site. Each server block sets $bubbly_php to an upstream name
	#           from conf.d/php_sockets.conf; there is a commented `set` ready in
	#           sites-available/bubbly_https.conf. This is how one server runs
	#           sites on different PHP versions.
	# [WARNING] With a variable the name is resolved per request, so a site that
	#           forgets its `set`, or misspells the upstream, returns 502 at
	#           request time with nothing wrong at `nginx -t`. Do not try to give
	#           the variable a fallback with `map`: nginx refuses to start when
	#           the same variable is created by both `map` and `set`.
	#fastcgi_pass $bubbly_php;

	# [OPTION] Specify time to wait in seconds for PHP to respond
	# [DEFAULT] 10 10 60
	fastcgi_connect_timeout 10;
	fastcgi_send_timeout    10;
	fastcgi_read_timeout    60;

}
