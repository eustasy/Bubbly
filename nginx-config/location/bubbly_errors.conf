# src=https://github.com/nginx-boilerplate/nginx-boilerplate/blob/master/boilerplate/locations/errors.conf

# [WARNING] Create 404.html and 50x.html in the site root before including this.
# A missing page 404s, re-enters error_page, and Nginx aborts the loop with
# "rewrite or internal redirection cycle" — a 500 where you wanted a 404.
fastcgi_intercept_errors   on;
error_page                 404 /404.html;
error_page                 500 501 502 503 504 /50x.html;

location ~ ^/[4-5][0-9][0-9]\.html$ {
	internal;
	include directive/bubbly_logs_off.conf;
}
