####	Let's Encrypt Pass-Through
# Serves the challenge files bubbly_renew-ssl.sh writes.
# [WARNING] Deliberately not under /tmp, which anyone can create a directory in
# and then own — and whoever owns this one can answer an ACME challenge and be
# issued a certificate for any name pointing here. /var/lib is root's alone.
# [WARNING] Keep identical to WEBROOT in bubbly_renew-ssl.sh, or validation 404s.
# CI compares them.
location ^~ /.well-known/acme-challenge/ {
	default_type text/plain;
	root /var/lib/bubbly-authenticator;
}
