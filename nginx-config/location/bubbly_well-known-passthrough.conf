####	Let's Encrypt Pass-Through
# Serves the ACME challenge files bubbly_renew-ssl.sh writes.
# [WARNING] This path is deliberately not under /tmp. Any local user or process —
# including a compromised PHP application running as www-data — can create a
# directory in /tmp before root does and thereby own it, and whoever owns it can
# place files under /.well-known/acme-challenge/. That is enough to answer an ACME
# challenge and be issued a certificate for any name pointing at this machine.
# /var/lib is writable by root alone.
# [WARNING] Keep this identical to WEBROOT in bubbly_renew-ssl.sh, or validation
# quietly 404s. CI compares the two.
location ^~ /.well-known/acme-challenge/ {
	default_type text/plain;
	root /var/lib/bubbly-authenticator;
}
