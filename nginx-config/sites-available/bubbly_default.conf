####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	Default Server
# Answers everything no other site claims: an unknown Host header, a connection
# with no SNI, or a request straight to the server's IP address.
#
# [WARNING] Symlink this into sites-enabled/ once per server. Without it, the
# default server is whichever sites-enabled file happens to sort first, so that
# file's first `server` block silently decides the TLS protocol list and key
# exchange groups for every site on the machine — and adding a site with an
# earlier name changes them underneath you.
# [WARNING] Only one default server may exist per listening address and port.
# A second one makes Nginx refuse to start: "a duplicate default server".
# [WARNING] Nothing here answers on the IP address any more, so monitoring that
# checks the bare IP over HTTP or HTTPS needs pointing at a real hostname.



####	HTTP
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# [OPTION] Server Name. `_` never matches a real Host header, so this block
	# is only ever reached as the default.
	server_name _;

	# [OPTION] Close the connection without sending a response.
	# Option 1. [DEFAULT] 444, Nginx's non-standard "close immediately".
	return 444;

	# Option 2. 421 Misdirected Request, if a response is preferred.
	#return 421;

	include directive/bubbly_logs_off.conf;
}



####	HTTPS
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	server_name _;

	# [WARNING] This is where the TLS protocol list and key exchange groups for
	# the whole socket are really set, because Nginx takes them from the default
	# server. Without this include they would fall back to the distribution's
	# nginx.conf, which on Debian and Ubuntu still permits TLS 1.0 and 1.1.
	include directive/bubbly_ssl-profile.conf;

	# [OPTION] Refuse the TLS handshake for anything that matches no site.
	# Option 1. [DEFAULT] Reject, which needs no certificate at all here.
	# [WARNING] Requires Nginx 1.19.4 or newer.
	ssl_reject_handshake on;

	# Option 2. Complete the handshake with a certificate of your own, then
	# close. Requires a certificate this server can present.
	#ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	#ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	#return 444;

	include directive/bubbly_logs_off.conf;
}
