####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	Default Server
# Answers whatever no site claims: an unknown Host, a connection with no SNI, or
# a request to the server's IP address.
#
# [WARNING] Symlink into sites-enabled/ once per server. Without it the role
# falls to whichever file sorts first, whose first `server` block then decides
# the TLS protocol list and key exchange groups for every site on the machine.
# [WARNING] One default server per address and port, or Nginx refuses to start
# with "a duplicate default server" — including the distribution's own.
# [WARNING] Nothing answers on the bare IP, so point monitoring at a hostname.



####	HTTP
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# `_` never matches a real Host, so this is only ever reached as the default.
	server_name _;

	# [OPTION] Close without responding.
	# Option 1. [DEFAULT] 444, Nginx's "close immediately".
	return 444;
	# Option 2. 421 Misdirected Request, if a response is preferred.
	#return 421;

	include directive/bubbly_logs_off.conf;
}



####	HTTPS
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	server_name _;

	# [WARNING] This is where the socket's protocols and key exchange groups are
	# really set, Nginx taking them from the default server. Without it they fall
	# back to the distribution's nginx.conf, which still permits TLS 1.0 and 1.1.
	include directive/bubbly_ssl-profile.conf;

	# [OPTION] What to do with a handshake matching no site.
	# Option 1. [DEFAULT] Refuse it, needing no certificate here at all.
	ssl_reject_handshake on;

	# Option 2. Complete it with a certificate of your own, then close.
	#ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	#ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	#return 444;

	include directive/bubbly_logs_off.conf;
}
