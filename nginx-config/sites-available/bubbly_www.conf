####	Config from Bubbly v3.0
# https://github.com/eustasy/Bubbly
#
# Replace "example.com" with your domain. Search for [OPTION] and [WARNING].
#
# Optional, alongside bubbly_https.conf: sends https://www.example.com to the
# apex. Leave it out for a subdomain, or any site that serves no www.
#
# [WARNING] The certificate has to name www.example.com, so request it with
# `-d example.com -d www.example.com`. Nginx loads this file either way, but
# browsers refuse the redirect from a certificate that does not.
# [WARNING] Plain-HTTP www is answered by bubbly_http.conf, whose server_name
# must keep www.example.com for ACME to validate it.



####	www Redirection Block
# Redirect https://www.example.com to https://example.com
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# [WARNING] Needs Nginx 1.25.1+; older wants `listen 443 ssl http2;` instead.
	http2 on;


	####	Core Configuration

	# [OPTION] Server Name
	server_name www.example.com;

	# [OPTION] Redirect Target
	location / {
		return 308 https://example.com$request_uri;
	}

	# [OPTION] Certificate Paths
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	include directive/bubbly_rock-hard-ssl.conf;

	# [OPTION] OCSP stapling, for a certificate whose CA still publishes a
	#          responder URL — not Let's Encrypt, which retired OCSP in 2025.
	#          Both lines together, the chain being what verifies the response.
	#ssl_trusted_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	#include directive/bubbly_ocsp-stapling.conf;


	include directive/bubbly_logs_off.conf;
	include groups/security-common.conf;
}
