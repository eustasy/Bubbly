####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly
#
# Replace "example.com" with your domain. Search for [OPTION] and [WARNING].
#
# [WARNING] Keep bubbly_http.conf symlinked alongside this file, so ACME renewal
# keeps working even once a certificate is due, and bubbly_default.conf too, so
# the default server is chosen deliberately rather than by filename order.
# [WARNING] Protocols, key exchange groups and the default cipher list come from
# directive/bubbly_ssl-profile.conf and only take effect from the default server;
# session resumption is server-wide in conf.d/bubbly_ssl.conf. The certificates
# below and stapling are the genuinely per-site parts.



####	HTTPS Redirection Block
# Redirect https://www.example.com to https://example.com
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# [WARNING] Needs Nginx 1.25.1+; older wants `listen 443 ssl http2;` instead.
	http2 on;


	####	Core Configuration

	# [OPTION] Server Name
	server_name www.example.com;

	# [OPTION] Redirect Target
	location / {
		return 308 https://example.com$request_uri;
	}

	# [OPTION] Certificate Paths
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	include directive/bubbly_rock-hard-ssl.conf;


	include directive/bubbly_logs_off.conf;
	include groups/security-common.conf;
}



####	Main HTTPS Block
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# [WARNING] Needs Nginx 1.25.1+; older wants `listen 443 ssl http2;` instead.
	http2 on;


	####	Core Configuration
	# [OPTION] Server Name
	server_name example.com;

	# [OPTION] Root Path
	root /path/to/example.com;

	# [OPTION] Index Entries
	index index.php index.html index.htm;

	# [OPTION] Automatic Indexes
	autoindex off;

	# [OPTION] PHP version, named after an upstream in conf.d/php_sockets.conf.
	#          Needs Option 2 in location/bubbly_extensionless-php.conf; left
	#          commented, every site shares the php_sockets default.
	#set $bubbly_php php85;

	# [OPTION] Certificate Paths
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	include directive/bubbly_rock-hard-ssl.conf;


	charset utf-8;


	####	Extensionless PHP
	include location/bubbly_extensionless-php.conf;
	location / {
		try_files $uri $uri/ @extensionless-php;
	}

	include groups/security-common.conf;
	include groups/performance-common.conf;
}
