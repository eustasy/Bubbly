####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

# Replace "example.com" with your domain.
# Search for [WARNING] to find common warnings.
# Search for [OPTION] to find options.
# [DEFAULT] denotes a default option choice.

# [WARNING] HTTP is handled by bubbly_http.conf — keep it symlinked in
# sites-enabled/ alongside this file so that ACME renewal (/.well-known/)
# continues to work even when the certificate is due for renewal.

# [WARNING] TLS protocols, key exchange groups, the default cipher list and
# session resumption are set once for the whole server in
# conf.d/bubbly_ssl.conf, because Nginx cannot vary them per site. Only the
# certificates below and the stapling settings are genuinely per-site.
# [WARNING] Keep bubbly_default.conf symlinked in sites-enabled/ too, so the
# default server is chosen deliberately rather than by filename order.



####	HTTPS Redirection Block
# Redirect https://www.example.com to https://example.com
server {
	listen 443 ssl;
	listen [::]:443 ssl;

	# [WARNING] The `http2` directive requires Nginx 1.25.1 or newer. Older
	# Nginx fails to load this file with "unknown directive"; the pre-1.25.1
	# spelling is `listen 443 ssl http2;`. See Requirements in the README.
	http2 on;


	####	Core Configuration

	# [OPTION] Server Name
	server_name www.example.com;

	# [OPTION] Redirect Target
	location / {
		return 308 https://example.com$request_uri;
	}

	# [OPTION] Certificate Paths
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	include directive/bubbly_rock-hard-ssl.conf;


	include directive/bubbly_logs_off.conf;
	include groups/security-common.conf;
}



####	Main HTTPS Block
server {
	listen 443 ssl;
	listen [::]:443 ssl;

	# [WARNING] The `http2` directive requires Nginx 1.25.1 or newer. Older
	# Nginx fails to load this file with "unknown directive"; the pre-1.25.1
	# spelling is `listen 443 ssl http2;`. See Requirements in the README.
	http2 on;


	####	Core Configuration
	# [OPTION] Server Name
	server_name example.com;

	# [OPTION] Root Path
	root /path/to/example.com;

	# [OPTION] Index Entries
	index index.php index.html index.htm;

	# [OPTION] Automatic Indexes
	autoindex off;

	# [OPTION] PHP version for this site, named after an upstream in
	#          conf.d/php_sockets.conf. Only has an effect once Option 2 is
	#          selected in location/bubbly_extensionless-php.conf; leave it
	#          commented and every site shares the php_sockets default.
	#set $bubbly_php php85;

	# [OPTION] Certificate Paths
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	include directive/bubbly_rock-hard-ssl.conf;


	charset utf-8;


	####	Extensionless PHP
	include location/bubbly_extensionless-php.conf;
	location / {
		try_files $uri $uri/ @extensionless-php;
	}

	include groups/security-common.conf;
	include groups/performance-common.conf;
}
