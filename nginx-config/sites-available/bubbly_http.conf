####	Config from Bubbly v3.0-beta2
# https://github.com/eustasy/Bubbly

####	HTTP Verification & Redirection
# Keep this symlinked in sites-enabled/ alongside bubbly_https.conf, permanently.
# ACME validation needs port 80 whatever state HTTPS is in — and if the
# certificate files are missing rather than merely expired, bubbly_https.conf
# will not load at all, leaving this the only way to obtain one.
server {
	listen 80;
	listen [::]:80;

	####	Core Configuration
	# [OPTION] Server Name
	server_name example.com www.example.com;

	# [OPTION] Redirect Target
	# [WARNING] The well-known passthrough (included via security-common)
	# uses ^~ and will always take priority over this redirect.
	location / {
		return 308 https://example.com$request_uri;
	}

	# [OPTION] Swap for directive/bubbly_logs.conf to log port 80, which this
	#          otherwise does not at all.
	include directive/bubbly_logs_off.conf;
	include groups/security-common.conf;

	# [OPTION] Only when behind a proxy or CDN, so ACME and redirect log lines
	#          record the client rather than the proxy.
	#include directive/bubbly_real-ip.conf;
}
