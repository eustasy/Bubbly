	####	Per-server TLS
	# Session resumption and the OCSP resolver are set once for the whole server
	# in conf.d/bubbly_ssl.conf, which Nginx loads by itself.

	# The protocol, group and cipher profile. Effective for the socket only from
	# the default server, but included here as well so a server without
	# bubbly_default.conf still gets these values instead of the distribution's
	# laxer nginx.conf defaults.
	include directive/bubbly_ssl-profile.conf;


	####	SSL Stapling
	# [WARNING] Requires a valid `ssl_trusted_certificate` to be already set in your site file
	ssl_stapling on;
	ssl_stapling_verify on;


	####	Keepalive
	# Use a higher keepalive timeout to reduce the need for repeated handshakes
	keepalive_timeout 300s; # up from 75 secs default


	####	Cipher List Override
	# [OPTION] `ssl_ciphers` is the one TLS setting Nginx really does apply per
	#          server, because the cipher is chosen after SNI has picked the
	#          server. Uncomment to give this site a cipher list of its own.
	#          It must stay below the profile include above, so that it wins.
	# [WARNING] Affects TLS 1.2 only. `ssl_ciphers` does not govern TLS 1.3
	#           ciphersuites, and `ssl_protocols` and `ssl_ecdh_curve` cannot be
	#           varied per server at all — see directive/bubbly_ssl-profile.conf.
	#ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
