	####	Per-server TLS
	# Session resumption and the OCSP resolver are set once, server-wide, in
	# conf.d/bubbly_ssl.conf, which Nginx loads by itself.

	# Effective for the socket only from the default server, but included here too
	# so a machine without bubbly_default.conf still gets it.
	include directive/bubbly_ssl-profile.conf;

	####	SSL Stapling
	# [WARNING] Needs `ssl_trusted_certificate` set in the site file.
	ssl_stapling on;
	ssl_stapling_verify on;

	# Fewer handshakes, at the cost of holding connections open. Up from 75s.
	keepalive_timeout 300s;

	# [OPTION] ssl_ciphers is the one TLS setting Nginx does apply per server, the
	#          cipher being chosen after SNI. Must stay below the include above to
	#          win. [WARNING] TLS 1.2 only: it does not govern TLS 1.3
	#          ciphersuites, and protocols and groups cannot vary per server.
	#ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
