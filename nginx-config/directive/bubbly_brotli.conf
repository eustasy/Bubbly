####	Brotli
# Compresses better than gzip at similar cost. Keep gzip alongside rather than
# instead: clients that do not offer `br` still get `gzip`.
#
# [WARNING] Needs libnginx-mod-http-brotli-filter, or `brotli on;` is an unknown
# directive and no config loads at all — which is why nothing includes this by
# default. A dynamic module, so check `nginx -T | grep -i brotli`, not `nginx -V`.
# The packages fit one exact Nginx ABI, so the distribution's own build only;
# nginx.org ships no Brotli.
# [WARNING] There is no `brotli_vary`. `Vary: Accept-Encoding` comes from
# `gzip_vary on;` in bubbly_gzip.conf — measured on 1.26 and 1.28, asserted in
# CI — so keep both, or caches may hand `br` to clients that cannot read it.

brotli on;

# [OPTION] Level 0-11; the module defaults to 6. 5 matches gzip_comp_level, and
#          Brotli wins on size at equal level. Above ~6 costs far more CPU.
brotli_comp_level 5;
#brotli_comp_level 4;

# Matching gzip_min_length; the module's 20 bytes compresses what cannot benefit.
brotli_min_length 256;

# [OPTION] Serve pre-compressed .br files. Needs the -static package as well.
#brotli_static on;

# [WARNING] Keep identical to gzip_types in bubbly_gzip.conf; CI fails on drift.
# text/html is always compressed and so is not listed.
brotli_types
	application/atom+xml
	application/geo+json
	application/javascript
	application/x-javascript
	application/json
	application/ld+json
	application/manifest+json
	application/rdf+xml
	application/rss+xml
	application/vnd.ms-fontobject
	application/wasm
	application/x-web-app-manifest+json
	application/xhtml+xml
	application/xml
	font/eot
	font/otf
	font/ttf
	image/bmp
	image/svg+xml
	text/cache-manifest
	text/calendar
	text/css
	text/javascript
	text/markdown
	text/plain
	text/xml
	text/vcard
	text/vnd.rim.location.xloc
	text/vtt
	text/x-component
	text/x-cross-domain-policy;
