####	Brotli
# Compresses better than gzip at comparable CPU cost, and every current browser
# supports it. Keep gzip alongside rather than instead: clients that do not offer
# `br` still get `gzip`, chosen per request from Accept-Encoding.
#
# [WARNING] Needs the module package installed, or `brotli on;` below is an
# unknown directive and the **entire** config fails to load — every site at once,
# not just this one. That is why nothing includes this by default.
#   Ubuntu and Debian: libnginx-mod-http-brotli-filter
#   Check it is loaded: nginx -T | grep -i brotli
# It is a dynamic module, so it does not appear in `nginx -V` alongside the
# compiled-in ones; the package drops a load_module line into modules-enabled/.
# [WARNING] The packages are built against one exact Nginx ABI, so they only fit
# the distribution's own build. Nginx from nginx.org ships no Brotli at all.
# [WARNING] There is no `brotli_vary`. Caches need `Vary: Accept-Encoding` or
# they may hand a compressed response to a client that cannot read it, so keep
# directive/bubbly_gzip.conf — which sets `gzip_vary on;` — included alongside.
# CI reports the header actually returned on a Brotli-encoded response.

brotli on;

# [OPTION] Compression level, 0 to 11. The module's own default is 6.
# [DEFAULT] 5, matching gzip_comp_level in bubbly_gzip.conf. Brotli beats gzip on
#           size at the same level, so this is a straight gain.
# [WARNING] Levels above about 6 cost far more CPU for very little size, and 11
#           is only sensible for files compressed ahead of time and served with
#           brotli_static below.
brotli_comp_level 5;
#brotli_comp_level 4;

# Matching gzip_min_length. The module default of 20 bytes compresses responses
# too small to benefit, where the encoding overhead can make them larger.
brotli_min_length 256;

# [OPTION] Serve pre-compressed `.br` files where they sit beside the original,
#          skipping compression entirely. Needs libnginx-mod-http-brotli-static
#          as well, and something to generate the files.
# [WARNING] `always` serves them even to clients that did not ask for Brotli.
#brotli_static on;

# [WARNING] Keep this list identical to gzip_types in bubbly_gzip.conf — CI
# compares them and fails if they drift. text/html is always compressed and is
# not listed, for Brotli as for gzip.
brotli_types
	application/atom+xml
	application/geo+json
	application/javascript
	application/x-javascript
	application/json
	application/ld+json
	application/manifest+json
	application/rdf+xml
	application/rss+xml
	application/vnd.ms-fontobject
	application/wasm
	application/x-web-app-manifest+json
	application/xhtml+xml
	application/xml
	font/eot
	font/otf
	font/ttf
	image/bmp
	image/svg+xml
	text/cache-manifest
	text/calendar
	text/css
	text/javascript
	text/markdown
	text/plain
	text/xml
	text/vcard
	text/vnd.rim.location.xloc
	text/vtt
	text/x-component
	text/x-cross-domain-policy;
