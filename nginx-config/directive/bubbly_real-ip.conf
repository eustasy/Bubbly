	####	Real Client Address
	# Recovers the client's own address when Nginx sits behind a proxy, CDN or
	# load balancer. Without this, $binary_remote_addr is the proxy, so every
	# visitor shares one identity: rate limits count the whole audience as a
	# single client, and access logs record the proxy on every line.
	#
	# [WARNING] Only ever trust addresses you control. set_real_ip_from tells
	# Nginx to believe a header, so naming a range you do not own lets anyone
	# in it forge their address — evading rate limits and poisoning your logs.
	# Never use 0.0.0.0/0.
	# [WARNING] Nothing enables this by default, and nothing here is uncommented.
	# A server reached directly from the internet must leave it that way.
	# [WARNING] Requires the realip module: check with
	# `nginx -V 2>&1 | grep -o with-http_realip_module`. Debian and Ubuntu build
	# it in; some third-party builds do not.


	####	Trusted Sources
	# [OPTION] Name every hop between the client and Nginx.

	# Option 1. A proxy on this machine, such as Varnish or an SSH tunnel.
	#set_real_ip_from 127.0.0.1;
	#set_real_ip_from ::1;

	# Option 2. A load balancer on a private network.
	#set_real_ip_from 10.0.0.0/8;
	#set_real_ip_from 172.16.0.0/12;
	#set_real_ip_from 192.168.0.0/16;

	# Option 3. Cloudflare, or another CDN.
	# [WARNING] Their ranges change, and Bubbly deliberately does not carry a
	# copy that would go stale. Fetch the current lists and paste them in:
	#   curl https://www.cloudflare.com/ips-v4
	#   curl https://www.cloudflare.com/ips-v6
	# Re-check them when you next touch this file.


	####	Header
	# [OPTION] Pick the header the trusted hop sets.

	# Option 1. [DEFAULT] X-Forwarded-For, which almost every proxy sets.
	# [WARNING] It is a list, appended to by each hop, so combine it with
	# real_ip_recursive below when there is more than one proxy in front.
	#real_ip_header X-Forwarded-For;

	# Option 2. CF-Connecting-IP — Cloudflare only, and a single value rather
	# than a list, so it cannot be confused by intermediate hops.
	#real_ip_header CF-Connecting-IP;

	# Option 3. The PROXY protocol, for a TCP load balancer that speaks it.
	# [WARNING] Also needs `proxy_protocol` on the listen directive in the site
	# file, and the port then accepts nothing else.
	#real_ip_header proxy_protocol;


	####	Recursion
	# [OPTION] With several proxies in front, walk X-Forwarded-For from the
	#          right and take the last address that is not itself trusted.
	#real_ip_recursive on;
