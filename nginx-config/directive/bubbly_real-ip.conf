	####	Real Client Address
	# Recovers the client's address when Nginx is behind a proxy, CDN or load
	# balancer. Without it $binary_remote_addr is the proxy, so rate limits count
	# the whole audience as one client and logs record the proxy on every line.
	#
	# [WARNING] Only trust ranges you control. set_real_ip_from tells Nginx to
	# believe a header, so naming a range you do not own lets anyone in it forge
	# their address, evading limits and poisoning logs. Never 0.0.0.0/0.
	# [WARNING] Nothing is uncommented here, and a server reached directly from
	# the internet must leave it that way.
	# [WARNING] Needs the realip module:
	# `nginx -V 2>&1 | grep -o with-http_realip_module`.


	# [OPTION] Trusted sources — name every hop between client and Nginx.

	# Option 1. A proxy on this machine, such as Varnish.
	#set_real_ip_from 127.0.0.1;
	#set_real_ip_from ::1;

	# Option 2. A load balancer on a private network.
	#set_real_ip_from 10.0.0.0/8;
	#set_real_ip_from 172.16.0.0/12;
	#set_real_ip_from 192.168.0.0/16;

	# Option 3. A CDN. [WARNING] Ranges change, so fetch them rather than trusting
	# a copy: curl https://www.cloudflare.com/ips-v4 and /ips-v6.


	# [OPTION] The header the trusted hop sets.

	# Option 1. [DEFAULT] X-Forwarded-For, which nearly every proxy sets.
	# [WARNING] A list, appended to by each hop, so pair it with real_ip_recursive
	# where more than one proxy is in front.
	#real_ip_header X-Forwarded-For;

	# Option 2. CF-Connecting-IP — Cloudflare only, and a single value.
	#real_ip_header CF-Connecting-IP;

	# Option 3. PROXY protocol. [WARNING] Also needs `proxy_protocol` on the
	# listen directive, after which the port accepts nothing else.
	#real_ip_header proxy_protocol;


	# [OPTION] With several proxies, take the last address that is not trusted.
	#real_ip_recursive on;
