	####	OCSP Stapling
	# Nginx fetches its own certificate's revocation status from the CA, caches
	# it, and staples it into the handshake, sparing every client that round trip
	# — and the privacy cost of telling the CA which site it is visiting.
	#
	# [WARNING] Useless with Let's Encrypt, which stopped putting an OCSP
	# responder URL in certificates on 2025-05-07 and shut its responders down on
	# 2025-08-06. There is then nothing to fetch, so Nginx staples nothing and
	# logs `"ssl_stapling" ignored, no OCSP responder URL in the certificate` at
	# every config test and reload. Google Trust Services dropped OCSP through
	# the second half of 2025 the same way. Verified 2026-09-10 as still issuing
	# with an OCSP URL: ZeroSSL (free, ACME with EAB, wildcards), SSL.com and
	# Actalis (free, one name plus www), and the paid ACME CAs — DigiCert,
	# GlobalSign, Sectigo. CA/Browser Forum ballot SC-063v4 made OCSP optional
	# and CRLs mandatory, so any of them may follow.
	#
	# [WARNING] Check the certificate before enabling. An empty answer means this
	# file will do nothing but warn:
	#           openssl x509 -noout -ocsp_uri \
	#             -in /etc/letsencrypt/live/example.com/cert.pem
	#
	# [WARNING] Include this inside a `server` block, below the certificate paths,
	# and uncomment `ssl_trusted_certificate` alongside them — verifying the
	# response needs the issuer chain.

	ssl_stapling on;
	ssl_stapling_verify on;

	# Nginx has no resolver of its own and cannot reach the responder without
	# one. Cloudflare, Quad9, Google, OpenDNS.
	resolver 1.1.1.1 1.0.0.1 9.9.9.9 149.112.112.112 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=300s;
	resolver_timeout 3s;
