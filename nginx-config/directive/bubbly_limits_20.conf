# 20 requests a second and 20 connections, counted per client across every
# site on the machine.
# [OPTION] On a server hosting more than one site, include
#          directive/bubbly_limits_site_20.conf instead, which counts per site
#          per client so one site cannot exhaust another's allowance.
# [WARNING] Neither limit applies to a response produced by `return`, such as
#           the HTTP-to-HTTPS redirect in bubbly_http.conf. `return` is handled
#           in the rewrite phase, which runs before the preaccess phase where
#           limit_req and limit_conn are evaluated, so the response is finalised
#           without ever consulting them. Only requests that reach content —
#           static files, PHP, proxied upstreams — are limited.
limit_req zone=reqPerSec20 burst=100 nodelay;
limit_conn conPerIP 20;
