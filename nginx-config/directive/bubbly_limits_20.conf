# 20 requests a second and 20 connections, counted per client across every
# site on the machine.
# [OPTION] On a server hosting more than one site, include
#          directive/bubbly_limits_site_20.conf instead, which counts per site
#          per client so one site cannot exhaust another's allowance.
limit_req zone=reqPerSec20 burst=100 nodelay;
limit_conn conPerIP 20;
