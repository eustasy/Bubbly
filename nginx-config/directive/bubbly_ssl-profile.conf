	####	TLS Profile
	# Included in a `server` block, never at the `http` level: Debian and Ubuntu
	# already set ssl_protocols and ssl_prefer_server_ciphers in their own
	# nginx.conf, and setting them again in conf.d is a duplicate that stops
	# Nginx starting.
	#
	# [WARNING] Only the copy in the **default server** for a listening socket
	# takes effect. A handshake begins before SNI has selected a server, so
	# Nginx takes ssl_protocols and ssl_ecdh_curve from the default server
	# whatever a site asks for — measured on Nginx 1.26 and 1.28. Sites include
	# this too, so that a server with no bubbly_default.conf enabled still gets
	# these values rather than the distribution's laxer defaults.
	# [WARNING] ssl_ciphers is the exception: chosen after SNI, so it can be
	# overridden per site. See directive/bubbly_rock-hard-ssl.conf.

	# Tracking TLSRef Guideline v6.0, generated for Bubbly's reference target of
	# Nginx 1.28 with OpenSSL 3.5. Regenerate from:
	# https://configurator.tlsref.org/

	# [OPTION] Select SSL protocols and Cipher List.
	# [WARNING] Breaks some browsers on some settings, many browsers on high settings.
	# Option 1. Modern — TLS 1.3 only. Drops everything older than ~2020 browsers.
	# Option 2. [DEFAULT] Intermediate — TLS 1.2 + 1.3. Supports the last several
	#                     versions of every modern browser, plus a long tail.
	#                     The configurator carries the current client lists.
	# [WARNING] Both options list the X25519MLKEM768 post-quantum group, which
	#           needs OpenSSL 3.5 or newer. Older OpenSSL rejects the whole group
	#           list rather than skipping a name it does not recognise, so
	#           `nginx -t` fails. On OpenSSL 3.4 or older the guideline's list is
	#           `X25519:prime256v1:secp384r1`. See Requirements in the README.

	# Option 1. Modern: TLS 1.3 only, with no fallback to older protocols or cipher suites.
	# [OPTION] With TLS 1.2 gone, ssl_session_timeout and ssl_session_cache in
	#          conf.d/bubbly_ssl.conf are no longer needed — TLS 1.3 resumes from
	#          tickets — and the guideline comments them out for this profile.
	# generated 2026-08-05, TLSRef Guideline v6.0, nginx 1.28, OpenSSL 3.5, modern config, HSTS, OCSP, gitrev=1b22dc6
	# https://configurator.tlsref.org/#server=nginx&version=1.28&config=modern&openssl=3.5&hsts&ocsp&guideline=6.0
	#ssl_protocols TLSv1.3;
	#ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	#ssl_prefer_server_ciphers off;

	# Option 2. [DEFAULT] Intermediate — TLS 1.2 + 1.3.
	# generated 2026-08-05, TLSRef Guideline v6.0, nginx 1.28, OpenSSL 3.5, intermediate config, HSTS, OCSP, gitrev=1b22dc6
	# https://configurator.tlsref.org/#server=nginx&version=1.28&config=intermediate&openssl=3.5&hsts&ocsp&guideline=6.0
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
