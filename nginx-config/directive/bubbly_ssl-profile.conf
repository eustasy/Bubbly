	####	TLS Profile
	# Included in a `server` block, never at the `http` level: Debian and Ubuntu
	# already set ssl_protocols and ssl_prefer_server_ciphers in their own
	# nginx.conf, and setting them again in conf.d is a duplicate that stops
	# Nginx starting.
	#
	# [WARNING] Only the copy in the **default server** for a listening socket
	# takes effect. A handshake begins before SNI has selected a server, so
	# Nginx takes ssl_protocols and ssl_ecdh_curve from the default server
	# whatever a site asks for — measured on Nginx 1.26 and 1.28. Sites include
	# this too, so that a server with no bubbly_default.conf enabled still gets
	# these values rather than the distribution's laxer defaults.
	# [WARNING] ssl_ciphers is the exception: chosen after SNI, so it can be
	# overridden per site. See directive/bubbly_rock-hard-ssl.conf.

	# Tracking Mozilla SSL Configuration Generator, Guideline v6.0:
	# https://ssl-config.mozilla.org/

	# [OPTION] Select SSL protocols and Cipher List.
	# [WARNING] Breaks some browsers on some settings, many browsers on high settings.
	# Option 1. Modern  — TLS 1.3 only. Drops everything older than ~2020 browsers.
	# Option 2. [DEFAULT] Intermediate — TLS 1.2 + 1.3. Supports the last several
	#                     versions of every modern browser, plus a long tail.
	# [WARNING] Both options list the X25519MLKEM768 post-quantum group, which
	#           requires OpenSSL 3.5 or newer. Older OpenSSL rejects the whole
	#           group list rather than skipping a name it does not recognise,
	#           so `nginx -t` fails. Drop X25519MLKEM768 from the list to run
	#           on OpenSSL 3.0. See Requirements in the README.

	# Option 1. Modern: TLS 1.3 only, with no fallback to older protocols or cipher suites.
	# Supports Firefox 63, Android 10.0, Chrome 70, Edge 75,
	#          Java 11, OpenSSL 1.1.1, Opera 57, Safari 12.1
	# generated 2026-04-28, Mozilla Guideline v6.0, nginx 1.27.3, OpenSSL 3.6.1, modern config, HSTS, OCSP
	# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.6.1&hsts&ocsp&guideline=6.0
	#ssl_protocols TLSv1.3;
	#ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	#ssl_prefer_server_ciphers off;

	# Option 2. [DEFAULT] Intermediate — TLS 1.2 + 1.3. Supports the last several
	#                     versions of every modern browser, plus a long tail.
	# Supports Firefox 31.3.0, Android 4.4.2, Chrome 49, Edge 15 on Windows 10,
	#          IE 11 on Windows 10, Java 8u161, OpenSSL 1.0.1l, Opera 20, Safari 9
	# generated 2026-04-28, Mozilla Guideline v6.0, nginx 1.27.3, OpenSSL 3.6.1, intermediate config, HSTS, OCSP
	# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=intermediate&openssl=3.6.1&hsts&ocsp&guideline=6.0
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
