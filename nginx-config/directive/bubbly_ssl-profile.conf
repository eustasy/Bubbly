	####	TLS Profile
	# Included in a `server` block, never at `http`: Debian and Ubuntu already set
	# ssl_protocols and ssl_prefer_server_ciphers in their nginx.conf.
	#
	# [WARNING] Only the copy in the **default server** for a socket takes effect.
	# A handshake starts before SNI picks a server, so Nginx takes ssl_protocols
	# and ssl_ecdh_curve from the default server whatever a site asks — measured
	# on Nginx 1.26 and 1.28. Sites include this too, so a machine without
	# bubbly_default.conf still gets these rather than the distribution's laxer
	# defaults. ssl_ciphers is the exception, chosen after SNI and overridable per
	# site: see directive/bubbly_rock-hard-ssl.conf.

	# [OPTION] Protocols and ciphers, from TLSRef Guideline v6.0 generated for
	#          Nginx 1.28 with OpenSSL 3.5. Regenerate for those versions at
	#          https://configurator.tlsref.org/ — not the newest on offer.
	# Option 1. Modern — TLS 1.3 only, dropping browsers older than ~2020. Also
	#           makes ssl_session_cache and ssl_session_timeout redundant, since
	#           TLS 1.3 resumes from tickets.
	# Option 2. [DEFAULT] Intermediate — TLS 1.2 and 1.3, with a long tail of
	#           older clients. The configurator lists which.
	# [WARNING] X25519MLKEM768 needs OpenSSL 3.5+. Older OpenSSL rejects the whole
	#           group list rather than skipping the name, failing `nginx -t`; its
	#           list is `X25519:prime256v1:secp384r1`.

	# Option 1. gitrev=1b22dc6, modern config, HSTS, OCSP
	# https://configurator.tlsref.org/#server=nginx&version=1.28&config=modern&openssl=3.5&hsts&ocsp&guideline=6.0
	#ssl_protocols TLSv1.3;
	#ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	#ssl_prefer_server_ciphers off;

	# Option 2. gitrev=1b22dc6, intermediate config, HSTS, OCSP
	# https://configurator.tlsref.org/#server=nginx&version=1.28&config=intermediate&openssl=3.5&hsts&ocsp&guideline=6.0
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
