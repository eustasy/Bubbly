# 20r/s and 20 connections per client per site.
# Rates and zone sizes live in conf.d/bubbly_limits.conf, along with the caveats
# that decide whether either is safe here.
# [OPTION] Include inside `location ~ \.php$` rather than the `server` block —
#          see location/bubbly_extensionless-php.conf. At server level every
#          stylesheet and image is counted, so one cold-cache page load spends
#          most of the burst and shared addresses see rejections.
# [OPTION] delay paces the second half of a burst; nodelay refuses it instead.
limit_req zone=siteReqPerIP burst=100 delay=50;
#limit_req zone=siteReqPerIP burst=100 nodelay;

limit_conn siteConPerIP 20;
