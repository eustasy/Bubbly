# Requests and connections counted per site per client.
# The rate lives with the zone in conf.d/bubbly_limits.conf; change it there.
#
# [OPTION] Where to include this matters more than the numbers.
# Option 1. [DEFAULT] Inside `location ~ \.php$`, using the commented include in
#           location/bubbly_extensionless-php.conf. Only the requests that cost
#           something are counted, so a page load spends one token rather than
#           the seventy a typical page's assets would.
# Option 2. In the `server` block, which counts every stylesheet and image too.
#           A cold-cache page load then spends most of the burst by itself, and
#           an office behind one address will see rejections.
#
# [WARNING] Prefer this over bubbly_limits_ip.conf whenever the machine hosts
# more than one site: those zones are keyed on the client address alone, so every
# site shares one budget per client.
# [WARNING] Behind a proxy or CDN the client address is the proxy's, so this
# throttles your whole audience as one client. See directive/bubbly_real-ip.conf.
# [WARNING] Neither limit applies to a response produced by `return`, such as
# the HTTP-to-HTTPS redirect in bubbly_http.conf. `return` is handled in the
# rewrite phase, which runs before the preaccess phase where limit_req and
# limit_conn are evaluated, so the response is finalised without ever consulting
# them. Only requests that reach content are limited.
# [WARNING] An HTTP/2 client multiplexes every request over a single connection,
# so a browser sits at one or two connections however many requests it makes. A
# connection cap therefore catches floods rather than shaping ordinary traffic;
# limit_req is what does that.

# [OPTION] What to do with a burst.
# Option 1. [DEFAULT] delay — half the burst passes straight through and the
#           rest is paced to the rate instead of being rejected, so a shared
#           address degrades into slowness rather than errors.
# Option 2. nodelay — the whole burst passes immediately and anything beyond it
#           is rejected. Lower latency, less forgiving.
limit_req zone=siteReqPerIP burst=100 delay=50;
#limit_req zone=siteReqPerIP burst=100 nodelay;

limit_conn siteConPerIP 20;
