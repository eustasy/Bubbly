# Requests and connections counted per site per client.
# The rate lives with the zone in conf.d/bubbly_limits.conf; change it there.
# [WARNING] Prefer this over bubbly_limits_ip.conf whenever the machine hosts
# more than one site: those zones are keyed on the client address alone, so every
# site shares one budget per client.
# [WARNING] Neither limit applies to a response produced by `return`, such as
# the HTTP-to-HTTPS redirect in bubbly_http.conf. `return` is handled in the
# rewrite phase, which runs before the preaccess phase where limit_req and
# limit_conn are evaluated, so the response is finalised without ever consulting
# them. Only requests that reach content are limited.
# [WARNING] An HTTP/2 client multiplexes every request over a single connection,
# so a browser sits at one or two connections however many requests it makes. A
# connection cap therefore catches floods rather than shaping ordinary traffic;
# limit_req is what does that.
limit_req zone=siteReqPerIP burst=100 nodelay;
limit_conn siteConPerIP 20;
