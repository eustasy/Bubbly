# 2000 concurrent connections for this site, whoever they come from. A blunt
# guard against one site consuming the whole machine.
# [WARNING] The cap can only ever be reached if worker_processes multiplied by
# worker_connections exceeds it. Debian and Ubuntu set worker_connections to 768
# in their nginx.conf, so on a one- or two-core machine this limit is
# unreachable and does nothing. Check with `nginx -T | grep worker_`.
limit_conn conPerServer 2000;
