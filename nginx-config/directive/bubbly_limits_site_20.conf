# 20 requests a second and 20 connections, counted per site per client.
# [WARNING] Prefer this over bubbly_limits_20.conf whenever the machine hosts
# more than one site: those zones are keyed on the client address alone, so
# every site shares one budget per client.
# [WARNING] Neither limit applies to a response produced by `return`, such as
# the HTTP-to-HTTPS redirect in bubbly_http.conf. `return` is handled in the
# rewrite phase, which runs before the preaccess phase where limit_req and
# limit_conn are evaluated, so the response is finalised without ever consulting
# them. Only requests that reach content are limited.
limit_req zone=siteReqPerSec20 burst=100 nodelay;
limit_conn siteConPerIP 20;
