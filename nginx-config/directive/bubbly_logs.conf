####	Logs
# [WARNING] These are the paths Debian and Ubuntu already use, so including this
# unedited changes nothing but the error log's verbosity. Point them at per-site
# files to actually get per-site logs.
# [OPTION] Set access log location.
access_log /var/log/nginx/access.log;

# [OPTION] Set error log location.
error_log /var/log/nginx/error.log warn;
