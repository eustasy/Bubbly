# Requests and connections counted per client across every site on the machine.
# The rate lives with the zone in conf.d/bubbly_limits.conf; change it there.
# [OPTION] On a server hosting more than one site, include
#          directive/bubbly_limits_site.conf instead, which counts per site per
#          client so one site cannot exhaust another's allowance.
# [WARNING] Neither limit applies to a response produced by `return`, such as
#           the HTTP-to-HTTPS redirect in bubbly_http.conf. `return` is handled
#           in the rewrite phase, which runs before the preaccess phase where
#           limit_req and limit_conn are evaluated, so the response is finalised
#           without ever consulting them. Only requests that reach content —
#           static files, PHP, proxied upstreams — are limited.
# [WARNING] An HTTP/2 client multiplexes every request over a single connection,
#           so a browser sits at one or two connections however many requests it
#           makes. A connection cap therefore catches floods rather than shaping
#           ordinary traffic; limit_req is what does that.
limit_req zone=reqPerIP burst=100 nodelay;
limit_conn conPerIP 20;
