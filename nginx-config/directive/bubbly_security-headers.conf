####	Cross-Origin Embedder Policy
# [OPTION] Whether the page may load cross-origin resources that do not opt in
#          via CORS or CORP.
# Option 1. require-corp — required for cross-origin isolation
#           (SharedArrayBuffer, high-resolution timers).
# [WARNING] Breaks any third-party resource that does not send CORP.
#add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Option 2. credentialless — cross-origin resources load without credentials.
#add_header Cross-Origin-Embedder-Policy "credentialless" always;
# Option 3. [DEFAULT] unsafe-none — no restrictions, for sites loading CDNs or
#           embeds that send no CORP.
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;


####	Cross-Origin Opener Policy
# [OPTION] Whether popups share a browsing context group with this page.
# Option 1. [DEFAULT] same-origin — full isolation.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Option 2. same-origin-allow-popups — allows same-origin popups, for OAuth.
#add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Option 3. unsafe-none — the browser default.
#add_header Cross-Origin-Opener-Policy "unsafe-none" always;


####	Cross-Origin Resource Policy
# [OPTION] Which origins may load this resource.
# Option 1. [DEFAULT] same-origin.
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Option 2. same-site.
#add_header Cross-Origin-Resource-Policy "same-site" always;
# Option 3. cross-origin. [WARNING] Only for deliberately public assets.
#add_header Cross-Origin-Resource-Policy "cross-origin" always;


####	Access Control Allow Origin
# [OPTION] CORS.
# Option 1. [DEFAULT] Same-origin only, expressed by sending no header at all,
#           which is what browsers enforce in its absence.
# [WARNING] External sites cannot load your assets.
# Option 2. Any origin.
#add_header Access-Control-Allow-Origin "*" always;


####	Content Security Policy
# [OPTION] Generate one at https://report-uri.com/home/generate
# Option 1. [DEFAULT] Off.
# Option 2. Report only, with a reporting URL of your own.
#add_header Content-Security-Policy-Report-Only "default-src 'self'; report-uri https://%report-uri-username%.report-uri.com/r/d/csp/reportOnly" always;
# Option 3. Report and enforce.
# [WARNING] Off by default for good reason: it breaks a great deal when the
#           policy is wrong.
#include directive/bubbly_security-headers_csp.conf;


####	Content Type Options
# Stops content being loaded as a different MIME type.
add_header X-Content-Type-Options NOSNIFF always;


####	Frame Options
# [OPTION] Whether pages may be framed. CSP frame-ancestors supersedes this and
#          is the only one of the two that accepts a list of origins.
# Option 1. [DEFAULT] DENY. [WARNING] Breaks deliberately iframed sites.
# Option 2. SAMEORIGIN.
add_header X-Frame-Options DENY always;


####	Permissions Policy
# [DEFAULT] Allow nothing. Feature-Policy, its predecessor, is not sent: only
# Chrome 60 to 87 ever honoured it.
set $bubbly_pp                "accelerometer=()";
set $bubbly_pp "$bubbly_pp,  ambient-light-sensor=()";
set $bubbly_pp "$bubbly_pp,  autoplay=()";
set $bubbly_pp "$bubbly_pp,  battery=()";
set $bubbly_pp "$bubbly_pp,  camera=()";
set $bubbly_pp "$bubbly_pp,  display-capture=()";
set $bubbly_pp "$bubbly_pp,  encrypted-media=()";
set $bubbly_pp "$bubbly_pp,  fullscreen=()";
set $bubbly_pp "$bubbly_pp,  geolocation=()";
set $bubbly_pp "$bubbly_pp,  gyroscope=()";
set $bubbly_pp "$bubbly_pp,  keyboard-map=()";
set $bubbly_pp "$bubbly_pp,  magnetometer=()";
set $bubbly_pp "$bubbly_pp,  microphone=()";
set $bubbly_pp "$bubbly_pp,  midi=()";
set $bubbly_pp "$bubbly_pp,  payment=()";
set $bubbly_pp "$bubbly_pp,  picture-in-picture=()";
set $bubbly_pp "$bubbly_pp,  publickey-credentials-get=()";
set $bubbly_pp "$bubbly_pp,  screen-wake-lock=()";
set $bubbly_pp "$bubbly_pp,  usb=()";
set $bubbly_pp "$bubbly_pp,  web-share=()";
set $bubbly_pp "$bubbly_pp,  xr-spatial-tracking=()";
add_header Permissions-Policy $bubbly_pp always;


####	Referrer Policy
# [OPTION] Many values exist; see
# https://scotthelme.co.uk/a-new-security-header-referrer-policy/
add_header Referrer-Policy "strict-origin-when-cross-origin" always;


####	Server Version
# [OPTION] Stop sending the Nginx version.
server_tokens off;


####	Strict Transport Security
# [WARNING] Blocks HTTP for the duration, so it cannot be undone quickly.
# [OPTION] TLSRef Guideline v6.0 includes subdomains; Bubbly does not by default,
#          since that commits subdomains which may not exist yet.
# Option 1. [DEFAULT] This domain only.
add_header Strict-Transport-Security "max-age=63072000" always;
# Option 2. With subdomains, and preload.
#add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;


####	XSS Protection
# 0 disables the XSS Auditor, which every major browser removed by 2019 as being
# itself exploitable.
add_header X-XSS-Protection 0 always;
