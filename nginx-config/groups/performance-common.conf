# [OPTION] Brotli, which compresses better than gzip and sits alongside it.
# [WARNING] Not enabled by default because it needs a module package installed —
# libnginx-mod-http-brotli-filter on Ubuntu and Debian — and without it
# `brotli on;` is an unknown directive that stops Nginx loading any config at
# all. Install the package, then uncomment. See directive/bubbly_brotli.conf.
#include directive/bubbly_brotli.conf;
